
<!DOCTYPE html>
<html><head>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;padding:14px;min-height:100vh;background:#FFF8F0}
.banner{border-radius:24px;padding:16px 20px 12px;text-align:center;margin-bottom:16px}
.b1{background:linear-gradient(135deg,#f472b6,#a855f7)}
.b2{background:linear-gradient(135deg,#34d399,#3b82f6)}
.b3{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.b4{background:linear-gradient(135deg,#06b6d4,#6366f1)}
.b5{background:linear-gradient(135deg,#84cc16,#f97316)}
.banner h1{font-size:22px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.2)}
.banner p{font-size:13px;color:rgba(255,255,255,.9);margin-top:4px}
.score-pill{background:linear-gradient(90deg,#fde68a,#fbbf24);border-radius:40px;padding:6px 22px;font-size:15px;font-weight:bold;color:#78350f;text-align:center;width:fit-content;margin:0 auto 16px;display:block;box-shadow:0 3px 10px rgba(251,191,36,.4)}
.ejercicio{border-radius:28px;padding:22px 18px;margin-bottom:16px}
.e1{background:linear-gradient(135deg,#fce7f3,#ede9fe);border:3px solid #f9a8d4}
.e2{background:linear-gradient(135deg,#d1fae5,#dbeafe);border:3px solid #6ee7b7}
.e3{background:linear-gradient(135deg,#fef3c7,#fee2e2);border:3px solid #fbbf24}
.e4{background:linear-gradient(135deg,#cffafe,#e0e7ff);border:3px solid #67e8f9}
.e5{background:linear-gradient(135deg,#ecfccb,#ffedd5);border:3px solid #a3e635}
.ej-label{font-size:13px;font-weight:bold;margin-bottom:14px;padding:6px 16px;border-radius:40px;display:inline-block}
.l1{background:#fdf4ff;color:#7e22ce}
.l2{background:#ecfdf5;color:#065f46}
.l3{background:#fffbeb;color:#92400e}
.l4{background:#ecfeff;color:#164e63}
.l5{background:#f7fee7;color:#3f6212}
.dados-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
/* Dado con número grande */
.dado-num{width:82px;height:82px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;position:relative;flex-shrink:0}
.dn1{background:linear-gradient(135deg,#f9a8d4,#e879f9);border:3px solid #c026d3;color:#fff;box-shadow:0 6px 18px rgba(192,38,211,.35)}
.dn2{background:linear-gradient(135deg,#6ee7b7,#34d399);border:3px solid #059669;color:#fff;box-shadow:0 6px 18px rgba(5,150,105,.35)}
.dn3{background:linear-gradient(135deg,#fcd34d,#f59e0b);border:3px solid #d97706;color:#fff;box-shadow:0 6px 18px rgba(217,119,6,.35)}
.dado-num .brillo{position:absolute;top:8px;left:10px;width:18px;height:18px;background:rgba(255,255,255,.4);border-radius:50%}
/* Dado con puntos reales */
.dado-svg{flex-shrink:0}
.mas-signo{font-size:28px;font-weight:bold;color:#6366f1}
.total-box{text-align:center;font-size:20px;font-weight:bold;margin-bottom:16px;padding:8px 20px;border-radius:14px;display:inline-block;width:100%}
.t1{color:#7e22ce;background:#fdf4ff}.t2{color:#065f46;background:#ecfdf5}.t3{color:#92400e;background:#fffbeb}.t4{color:#164e63;background:#ecfeff}.t5{color:#3f6212;background:#f7fee7}
.opciones-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.opcion{padding:13px 10px;border-radius:18px;font-size:15px;font-weight:bold;cursor:pointer;text-align:center;border:3px solid transparent;transition:all .18s}
.o1{background:#fdf4ff;border-color:#d946ef;color:#7e22ce}
.o1:hover,.o1.sel{background:#e879f9;color:#fff;border-color:#a21caf;transform:scale(1.05)}
.o2{background:#ecfdf5;border-color:#10b981;color:#065f46}
.o2:hover,.o2.sel{background:#34d399;color:#fff;border-color:#059669;transform:scale(1.05)}
.o3{background:#fffbeb;border-color:#f59e0b;color:#92400e}
.o3:hover,.o3.sel{background:#fbbf24;color:#fff;border-color:#d97706;transform:scale(1.05)}
.o4{background:#ecfeff;border-color:#06b6d4;color:#164e63}
.o4:hover,.o4.sel{background:#22d3ee;color:#fff;border-color:#0891b2;transform:scale(1.05)}
.o5{background:#f7fee7;border-color:#84cc16;color:#3f6212}
.o5:hover,.o5.sel{background:#a3e635;color:#fff;border-color:#65a30d;transform:scale(1.05)}
.opcion.ok{background:linear-gradient(135deg,#d1fae5,#a7f3d0)!important;border-color:#059669!important;color:#064e3b!important;transform:scale(1.07)!important}
.opcion.fail{background:linear-gradient(135deg,#fee2e2,#fecaca)!important;border-color:#dc2626!important;color:#7f1d1d!important}
.msg{text-align:center;font-size:17px;font-weight:bold;min-height:26px;margin-bottom:12px}
.msg.bien{color:#059669}.msg.mal{color:#dc2626}
.btn-check{display:block;margin:0 auto 10px;padding:12px 30px;border:none;border-radius:40px;font-size:16px;font-weight:bold;cursor:pointer;color:#fff;transition:all .18s}
.bc1{background:linear-gradient(135deg,#e879f9,#a855f7);box-shadow:0 4px 14px rgba(168,85,247,.4)}
.bc2{background:linear-gradient(135deg,#34d399,#3b82f6);box-shadow:0 4px 14px rgba(59,130,246,.4)}
.bc3{background:linear-gradient(135deg,#fbbf24,#ef4444);box-shadow:0 4px 14px rgba(239,68,68,.4)}
.bc4{background:linear-gradient(135deg,#22d3ee,#6366f1);box-shadow:0 4px 14px rgba(99,102,241,.4)}
.bc5{background:linear-gradient(135deg,#a3e635,#f97316);box-shadow:0 4px 14px rgba(249,115,22,.4)}
.btn-check:hover{transform:scale(1.05)}
.btn-sig{display:none;margin:0 auto 10px;padding:12px 32px;border:none;border-radius:40px;font-size:16px;font-weight:bold;cursor:pointer;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.4)}
.btn-sig:hover{transform:scale(1.05)}
.pasos{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.paso{width:36px;height:10px;border-radius:40px;background:#e5e7eb;transition:background .3s}
.paso.act{background:#6366f1}.paso.done{background:#a7f3d0}
.final-box{background:linear-gradient(135deg,#ede9fe,#fce7f3);border:3px solid #a78bfa;border-radius:24px;padding:22px;text-align:center}
.final-box h2{font-size:24px;color:#4c1d95}.final-box p{font-size:15px;color:#6d28d9;margin-top:8px}
</style>
</head><body>

<div id="banner" class="banner b1">
  <h1 id="btitulo">🎲 ¡Paga con los dados!</h1>
  <p id="bsub">Elige las tarjetas que suman el total</p>
</div>
<div class="score-pill" id="score">⭐ Puntos: 0 / 0</div>
<div class="pasos" id="pasos"></div>
<div id="contenido"></div>
<button class="btn-sig" id="btn-sig" onclick="sigNivel()">Siguiente nivel ➡️</button>
<div id="final-panel"></div>

<script>
// Layouts de puntos del dado en grid 3x2 (fila,col)
const DADO_LAYOUT={
  1:[[1,0]],
  2:[[0,1],[2,0]],
  3:[[0,1],[1,0],[2,1]],  // corregido: diagonal
  4:[[0,0],[0,1],[2,0],[2,1]],
  5:[[0,0],[0,1],[1,0],[2,0],[2,1]],
  6:[[0,0],[0,1],[1,0],[1,1],[2,0],[2,1]],
};

// Colores de puntos por nivel
const DOT_COLORS={4:'#06b6d4',5:'#84cc16'};
const DADO_BG={4:'linear-gradient(135deg,#cffafe,#a5f3fc)',5:'linear-gradient(135deg,#ecfccb,#d9f99d)'};
const DADO_BORDER={4:'#0891b2',5:'#65a30d'};

function svgDado(n, nivel){
  const layout=DADO_LAYOUT[n]||[];
  const bg=DADO_BG[nivel]||'#fff';
  const border=DADO_BORDER[nivel]||'#888';
  const dotColor=DOT_COLORS[nivel]||'#6366f1';
  let dots='';
  layout.forEach(([r,c])=>{
    const x=18+c*28;
    const y=18+r*22;
    dots+=`<circle cx="${x}" cy="${y}" r="7" fill="${dotColor}"/>`;
  });
  return `<svg class="dado-svg" width="82" height="82" viewBox="0 0 82 82" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="bg${nivel}" x1="0" y1="0" x2="1" y2="1">
      ${nivel===4?'<stop offset="0" stop-color="#cffafe"/><stop offset="1" stop-color="#a5f3fc"/>':'<stop offset="0" stop-color="#ecfccb"/><stop offset="1" stop-color="#d9f99d"/>'}
    </linearGradient></defs>
    <rect x="3" y="3" width="76" height="76" rx="18" fill="url(#bg${nivel})" stroke="${border}" stroke-width="3"/>
    <circle cx="15" cy="14" r="7" fill="rgba(255,255,255,.5)"/>
    ${dots}
  </svg>`;
}

const NIVELES=[
  {titulo:'🎲 ¡Paga con los dados!', sub:'Dos dados grandes — elige 3 tarjetas que sumen el total', label:'Nivel 1 — 2 dados, 3 tarjetas', tipo:'num', dados:2, max:9, tarjetas:3, cl:'1'},
  {titulo:'🟢 ¡Paga lo del dado!', sub:'Un dado grande — elige 2 tarjetas que sumen el número', label:'Nivel 2 — 1 dado, 2 tarjetas', tipo:'num', dados:1, max:9, tarjetas:2, cl:'2'},
  {titulo:'🔥 ¡Súper desafío!', sub:'Dos dados sumados — elige 3 tarjetas para pagar', label:'Nivel 3 — 2 dados, 3 tarjetas', tipo:'num', dados:2, max:6, tarjetas:3, cl:'3'},
  {titulo:'🔵 ¡Cuenta los puntos!', sub:'Mira los puntitos del dado y elige 2 tarjetas', label:'Nivel 4 — dado con puntos reales, 2 tarjetas', tipo:'svg', dados:1, max:6, tarjetas:2, cl:'4'},
  {titulo:'🌿 ¡Dos dados de puntos!', sub:'Suma los puntitos de los dos dados y elige 3 tarjetas', label:'Nivel 5 — 2 dados con puntos, 3 tarjetas', tipo:'svg', dados:2, max:6, tarjetas:3, cl:'5'},
];

let nivelIdx=0, pts=0, respondido=false, respuesta=null;

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

function generarOps(total,n){
  const correctas=[];
  if(n===2){for(let a=1;a<=9;a++){const b=total-a;if(b>=1&&b<=9)correctas.push([a,b]);}}
  else{for(let a=1;a<=9;a++)for(let b=1;b<=9;b++){const c=total-a-b;if(c>=1&&c<=9)correctas.push([a,b,c]);}}
  correctas.sort(()=>Math.random()-.5);
  const buena=correctas[0];
  const malas=[];
  if(n===2){for(let a=1;a<=9&&malas.length<3;a++)for(let b=1;b<=9&&malas.length<3;b++)if(a+b!==total)malas.push([a,b]);}
  else{for(let a=1;a<=6&&malas.length<3;a++)for(let b=1;b<=6&&malas.length<3;b++)for(let c=1;c<=6&&malas.length<3;c++)if(a+b+c!==total)malas.push([a,b,c]);}
  malas.sort(()=>Math.random()-.5);
  return [{v:buena,ok:true},...malas.slice(0,3).map(v=>({v,ok:false}))].sort(()=>Math.random()-.5);
}

function renderPasos(){
  const p=document.getElementById('pasos'); p.innerHTML='';
  NIVELES.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='paso'+(i<nivelIdx?' done':i===nivelIdx?' act':'');
    p.appendChild(d);
  });
}

function renderNivel(){
  const nv=NIVELES[nivelIdx];
  const cl=nv.cl;
  respondido=false; respuesta=null;
  document.getElementById('banner').className=`banner b${cl}`;
  document.getElementById('btitulo').textContent=nv.titulo;
  document.getElementById('bsub').textContent=nv.sub;
  document.getElementById('btn-sig').style.display='none';
  document.getElementById('final-panel').innerHTML='';
  document.getElementById('score').textContent=`⭐ Puntos: ${pts} / ${nivelIdx}`;
  renderPasos();

  const vals=[];
  for(let i=0;i<nv.dados;i++) vals.push(rnd(1,nv.max));
  const total=vals.reduce((a,b)=>a+b,0);
  const ops=generarOps(total,nv.tarjetas);

  // Dados HTML
  let dadosHtml='<div class="dados-row">';
  vals.forEach((v,i)=>{
    if(nv.tipo==='svg'){
      dadosHtml+=svgDado(v,parseInt(cl));
    } else {
      dadosHtml+=`<div class="dado-num dn${cl}"><div class="brillo"></div>${v}</div>`;
    }
    if(i<vals.length-1) dadosHtml+=`<div class="mas-signo">+</div>`;
  });
  dadosHtml+='</div>';

  // Opciones
  let opsHtml='<div class="opciones-grid">';
  ops.forEach(({v,ok})=>{
    opsHtml+=`<button class="opcion o${cl}" data-ok="${ok?1:0}" onclick="selOp(this)">${v.join(' + ')}</button>`;
  });
  opsHtml+='</div>';

  document.getElementById('contenido').innerHTML=`
    <div class="ejercicio e${cl}">
      <div class="ej-label l${cl}">${nv.label}</div>
      ${dadosHtml}
      <div class="total-box t${cl}">Total a pagar: <span style="font-size:26px">🪙 ${total}</span></div>
      ${opsHtml}
      <button class="btn-check bc${cl}" onclick="comprobar(${total})">✅ Comprobar</button>
      <div class="msg" id="msg"></div>
    </div>`;
}

function selOp(btn){
  if(respondido) return;
  document.querySelectorAll('.opcion').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  respuesta=btn;
}

function comprobar(total){
  if(!respuesta){document.getElementById('msg').textContent='👆 Elige una opción primero';return;}
  if(respondido) return;
  respondido=true;
  const ok=respuesta.dataset.ok==='1';
  document.querySelectorAll('.opcion').forEach(b=>{
    if(b.dataset.ok==='1') b.classList.add('ok');
    else if(b===respuesta) b.classList.add('fail');
    b.style.pointerEvents='none';
  });
  const msg=document.getElementById('msg');
  if(ok){msg.textContent='🎉 ¡Perfecto! ¡Correcto!';msg.className='msg bien';pts++;document.getElementById('score').textContent=`⭐ Puntos: ${pts} / ${nivelIdx+1}`;}
  else{msg.textContent='😊 ¡Casi! La respuesta está en verde';msg.className='msg mal';}
  if(nivelIdx<NIVELES.length-1){
    document.getElementById('btn-sig').style.display='block';
  } else {
    const stars=pts>=5?'🏆🌟🌟🌟':pts>=4?'🎊🌟🌟':pts>=3?'😊🌟':'💪';
    document.getElementById('final-panel').innerHTML=`<div class="final-box">
      <div style="font-size:42px;margin:8px 0">${stars}</div>
      <h2>¡Terminaste todos los niveles!</h2>
      <p>Obtuviste <strong>${pts}</strong> de <strong>${NIVELES.length}</strong> puntos</p>
      <p style="margin-top:10px;font-size:13px">${pts===NIVELES.length?'¡Perfecto campeón! 🏆':pts>=3?'¡Muy buen trabajo!':'¡Sigue practicando!'}</p>
      <button onclick="nivelIdx=0;pts=0;renderNivel()" style="margin-top:14px;padding:12px 28px;border:none;border-radius:40px;font-size:15px;font-weight:bold;cursor:pointer;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff">🔄 Jugar de nuevo</button>
    </div>`;
    renderPasos();
  }
}

function sigNivel(){nivelIdx++;renderNivel();}
renderNivel();
</script>
</body></html>
